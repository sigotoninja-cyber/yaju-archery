<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>野獣アーチェリーシミュレーター - BEAST ARCHERY -</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      background: #0f1115;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      touch-action: none;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #gameContainer {
      position: relative;
      width: 100vw;
      max-width: 960px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-height: 100vh;
      background: #7ac1eb;
      touch-action: none;
    }
    #ui {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(10, 15, 25, 0.8);
      backdrop-filter: blur(4px);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15);
      font-size: 13px;
      line-height: 1.5;
      pointer-events: none;
      z-index: 10;
    }
    .badge {
      display: inline-block;
      padding: 1px 5px;
      background: #ff5722;
      border-radius: 3px;
      font-weight: bold;
      font-size: 10px;
    }
    #msg {
      position: absolute;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(32px, 8vw, 48px);
      font-weight: 900;
      pointer-events: none;
      text-shadow: 0 3px 10px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.5);
      letter-spacing: 2px;
      white-space: nowrap;
      z-index: 20;
    }
  </style>
</head>
<body>

<div id="gameContainer">
  <div id="ui">
    <div><span class="badge">MISSION</span> アイスティーを狙撃せよ</div>
    <div id="windText">風: 0.0 m/s</div>
    <div id="scoreText">SCORE: 0</div>
    <div style="color: #aaa; font-size: 10px; margin-top: 2px;">操作: 弓を左後ろにスワイプして離す</div>
  </div>
  <div id="msg"></div>
  <canvas id="canvas" width="960" height="540"></canvas>
</div>

<script>
// --- 音声合成エンジン (iOS Safari対策込み) ---
let audioUnlocked = false;

function unlockAudio() {
  if (audioUnlocked) return;
  if ('speechSynthesis' in window) {
    const dummy = new SpeechSynthesisUtterance('');
    dummy.volume = 0;
    window.speechSynthesis.speak(dummy);
  }
  audioUnlocked = true;
}

function speakYaju(text) {
  if (!('speechSynthesis' in window)) return;
  unlockAudio();
  window.speechSynthesis.cancel();
  const uttr = new SpeechSynthesisUtterance(text);
  uttr.lang = 'ja-JP';
  uttr.pitch = 0.55;
  uttr.rate = 0.82;
  window.speechSynthesis.speak(uttr);
}

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const windText = document.getElementById('windText');
const scoreText = document.getElementById('scoreText');
const msg = document.getElementById('msg');

let state = 'AIM'; // 'AIM', 'FLYING', 'RESULT'
let score = 0;
let wind = 0;
const gravity = 0.32;
let holdTimer = 0;
let urged = false;

// 射手
const shooter = { x: 140, y: 390 };
let isDragging = false;
let pullPos = { x: shooter.x, y: shooter.y };

// 矢
let arrow = {
  x: shooter.x, y: shooter.y,
  prevX: shooter.x, prevY: shooter.y,
  vx: 0, vy: 0,
  angle: 0,
  stuck: false
};

// 標的アイスティー（独立台座・判定ゆったり）
const tea = {
  x: 720,
  y: 280,
  w: 36,
  h: 52,
  hit: false
};

let particles = [];

function changeWind() {
  wind = +(Math.random() * 5 - 2.5).toFixed(1);
  const dir = wind > 0 ? `→ 追い風 ${wind}` : `← 向かい風 ${Math.abs(wind)}`;
  windText.textContent = `風: ${dir} m/s`;
}
changeWind();

// --- タッチ・マウス座標の精密変換 (画面サイズ追従) ---
function getPointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  
  // 縮小表示されたキャンバス実寸と内部解像度(960x540)の比率補正
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;

  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY
  };
}

function onStart(e) {
  unlockAudio();
  if (state !== 'AIM') return;
  const pos = getPointerPos(e);
  
  // スマホの指操作用に判定半径を少し広め(100px)に設定
  if (Math.hypot(pos.x - shooter.x, pos.y - shooter.y) < 100) {
    isDragging = true;
    pullPos = pos;
    holdTimer = Date.now();
    urged = false;
    if (e.cancelable) e.preventDefault();
  }
}

function onMove(e) {
  if (!isDragging) return;
  pullPos = getPointerPos(e);
  if (e.cancelable) e.preventDefault();
}

function onEnd(e) {
  if (!isDragging) return;
  isDragging = false;

  const pullDx = shooter.x - pullPos.x;
  const pullDy = shooter.y - pullPos.y;
  const dist = Math.hypot(pullDx, pullDy);

  if (dist > 15 && pullDx > 0) {
    const power = Math.min(dist * 0.23, 23);
    const angle = Math.atan2(pullDy, pullDx);
    arrow.x = shooter.x;
    arrow.y = shooter.y;
    arrow.prevX = shooter.x;
    arrow.prevY = shooter.y;
    arrow.vx = Math.cos(angle) * power;
    arrow.vy = Math.sin(angle) * power;
    arrow.angle = angle;
    arrow.stuck = false;
    state = 'FLYING';
  } else {
    pullPos = { x: shooter.x, y: shooter.y };
  }
}

// イベントリスナー
canvas.addEventListener('mousedown', onStart);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onEnd);

canvas.addEventListener('touchstart', onStart, { passive: false });
window.addEventListener('touchmove', onMove, { passive: false });
window.addEventListener('touchend', onEnd, { passive: false });

// 接触判定
function lineIntersectsRect(x1, y1, x2, y2, rx, ry, rw, rh) {
  if ((x1 >= rx && x1 <= rx + rw && y1 >= ry && y1 <= ry + rh) ||
      (x2 >= rx && x2 <= rx + rw && y2 >= ry && y2 <= ry + rh)) {
    return true;
  }
  const minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
  const minY = Math.min(y1, y2), maxY = Math.max(y1, y2);
  return !(maxX < rx || minX > rx + rw || maxY < ry || minY > ry + rh);
}

// --- メインループ ---
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

function update() {
  if (isDragging && !urged && Date.now() - holdTimer > 7500) {
    urged = true;
    speakYaju('あくしろよ');
  }

  if (state === 'FLYING') {
    arrow.prevX = arrow.x;
    arrow.prevY = arrow.y;

    arrow.x += arrow.vx;
    arrow.y += arrow.vy;
    arrow.vy += gravity;
    arrow.vx += wind * 0.018;
    arrow.angle = Math.atan2(arrow.vy, arrow.vx);

    const tipX = arrow.x + Math.cos(arrow.angle) * 20;
    const tipY = arrow.y + Math.sin(arrow.angle) * 20;
    const prevTipX = arrow.prevX + Math.cos(arrow.angle) * 20;
    const prevTipY = arrow.prevY + Math.sin(arrow.angle) * 20;

    // 【命中判定】アイスティー
    if (!tea.hit && lineIntersectsRect(prevTipX, prevTipY, tipX, tipY, tea.x - 12, tea.y - 12, tea.w + 24, tea.h + 24)) {
      tea.hit = true;
      arrow.stuck = true;
      arrow.x = tea.x + tea.w / 2;
      arrow.y = tea.y + tea.h / 2;
      state = 'RESULT';
      score += 114514;
      scoreText.textContent = `SCORE: ${score}`;
      msg.textContent = 'やりますねぇ！';
      msg.style.color = '#ffeb3b';
      speakYaju('やりますねぇ');

      for (let i = 0; i < 40; i++) {
        particles.push({
          x: tea.x + tea.w/2,
          y: tea.y + tea.h/2,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.8) * 14,
          color: Math.random() > 0.35 ? '#8B4513' : '#E0F7FA',
          size: Math.random() * 4 + 2,
          life: 1.0
        });
      }
      setTimeout(reset, 2400);
      return;
    }

    // 【外れ判定】地面または画面外
    const hitGround = tipY >= 500;
    const hitOut = tipX > canvas.width + 60 || tipX < -60;

    if (hitGround || hitOut) {
      arrow.stuck = true;
      state = 'RESULT';
      msg.textContent = 'なにやってんの！';
      msg.style.color = '#ff3d00';
      speakYaju('なにやってんの！');
      setTimeout(reset, 1800);
    }
  }

  for (let p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.28;
    p.life -= 0.022;
  }
  particles = particles.filter(p => p.life > 0);
}

function reset() {
  tea.hit = false;
  arrow.stuck = false;
  pullPos = { x: shooter.x, y: shooter.y };
  changeWind();
  msg.textContent = '';
  state = 'AIM';
}

// --- 描画処理 ---
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 空
  ctx.fillStyle = '#6ec1e4';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 雲
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath();
  ctx.arc(280, 80, 40, 0, Math.PI * 2);
  ctx.arc(320, 75, 45, 0, Math.PI * 2);
  ctx.arc(360, 85, 35, 0, Math.PI * 2);
  ctx.fill();

  // 地面（アスファルト）
  ctx.fillStyle = '#454d55';
  ctx.fillRect(0, 500, canvas.width, 40);
  ctx.strokeStyle = '#2d3238';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 500, canvas.width, 40);

  drawIceTea();
  drawArcher();

  if (state === 'FLYING' || arrow.stuck) {
    drawArrow(arrow.x, arrow.y, arrow.angle);
  }

  for (let p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

function drawIceTea() {
  // 台座
  ctx.fillStyle = '#e2e8f0';
  ctx.fillRect(tea.x - 20, tea.y + tea.h, tea.w + 40, 12);
  ctx.fillStyle = '#94a3b8';
  ctx.fillRect(tea.x - 10, tea.y + tea.h + 12, 10, 500 - (tea.y + tea.h + 12));
  ctx.fillRect(tea.x + tea.w, tea.y + tea.h + 12, 10, 500 - (tea.y + tea.h + 12));

  if (tea.hit) return;

  // ターゲットマーカー
  const pulse = Math.sin(Date.now() * 0.008) * 4;
  ctx.strokeStyle = '#ff1744';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(tea.x + tea.w/2, tea.y - 25 + pulse, 14, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = '#ff1744';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('TARGET', tea.x + tea.w/2, tea.y - 44 + pulse);

  // グラス
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(tea.x, tea.y, tea.w, tea.h);
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 2.5;
  ctx.strokeRect(tea.x, tea.y, tea.w, tea.h);

  // 液体
  ctx.fillStyle = '#8B4513';
  ctx.fillRect(tea.x + 3, tea.y + 10, tea.w - 6, tea.h - 13);

  // 氷
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillRect(tea.x + 6, tea.y + 14, 9, 9);
  ctx.fillRect(tea.x + 18, tea.y + 26, 9, 9);

  // ストロー
  ctx.strokeStyle = '#e53935';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(tea.x + 10, tea.y + tea.h - 10);
  ctx.lineTo(tea.x + 24, tea.y - 12);
  ctx.lineTo(tea.x + 32, tea.y - 16);
  ctx.stroke();
}

function drawArcher() {
  ctx.fillStyle = '#222';
  ctx.fillRect(shooter.x - 12, shooter.y - 25, 24, 50);
  ctx.beginPath();
  ctx.arc(shooter.x, shooter.y - 40, 14, 0, Math.PI * 2);
  ctx.fill();

  let pullX = isDragging ? pullPos.x : shooter.x;
  let pullY = isDragging ? pullPos.y : shooter.y;

  const topTip = { x: shooter.x + 8, y: shooter.y - 42 };
  const btmTip = { x: shooter.x + 8, y: shooter.y + 42 };

  // 弓
  ctx.strokeStyle = '#5c4033';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(shooter.x - 12, shooter.y, 45, -Math.PI / 2.3, Math.PI / 2.3, false);
  ctx.stroke();

  // 弦
  ctx.strokeStyle = '#f8fafc';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(topTip.x, topTip.y);
  if (isDragging) {
    ctx.lineTo(pullX, pullY);
    ctx.lineTo(btmTip.x, btmTip.y);
  } else {
    ctx.lineTo(shooter.x + 5, shooter.y);
    ctx.lineTo(btmTip.x, btmTip.y);
  }
  ctx.stroke();

  // ガイド線
  if (isDragging && state === 'AIM') {
    const pDx = shooter.x - pullX;
    const pDy = shooter.y - pullY;
    if (pDx > 5) {
      const aimAngle = Math.atan2(pDy, pDx);
      drawArrow(pullX + Math.cos(aimAngle)*20, pullY + Math.sin(aimAngle)*20, aimAngle);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(shooter.x, shooter.y);
      let simX = shooter.x, simY = shooter.y;
      let simVx = Math.cos(aimAngle) * Math.min(Math.hypot(pDx, pDy)*0.23, 23);
      let simVy = Math.sin(aimAngle) * Math.min(Math.hypot(pDx, pDy)*0.23, 23);
      for (let i = 0; i < 22; i++) {
        simX += simVx;
        simY += simVy;
        simVy += gravity;
        ctx.lineTo(simX, simY);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function drawArrow(x, y, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  ctx.strokeStyle = '#4a2c11';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-35, 0);
  ctx.lineTo(12, 0);
  ctx.stroke();

  ctx.fillStyle = '#94a3b8';
  ctx.beginPath();
  ctx.moveTo(12, -4);
  ctx.lineTo(20, 0);
  ctx.lineTo(12, 4);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#dc2626';
  ctx.beginPath();
  ctx.moveTo(-35, 0);
  ctx.lineTo(-30, -5);
  ctx.lineTo(-24, 0);
  ctx.lineTo(-30, 5);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

loop();
</script>
</body>
</html>
